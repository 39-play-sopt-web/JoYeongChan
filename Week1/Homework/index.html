<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="개발자 조영찬의 자기소개 페이지입니다. 포토 덤프, 좋아하는 것, 관심사를 소개해요." />
    <title>조영찬 자기소개</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__left">
        <img class="header__avatar" src="images/avatar.webp" alt="프로필 아바타" />
      </div>
      <h1 class="header__title">조영찬 자기소개</h1>
      <ul class="header__socials">
        <li>
          <a href="https://github.com/ychany" target="_blank" rel="noopener noreferrer">
            <img src="images/github.png" alt="GitHub" />
          </a>
        </li>
      </ul>
    </header>

    <div class="layout">
      <nav class="nav">
        <ul class="nav__list">
          <li><a class="nav__link" href="#photo-dump">📷 포토 덤프</a></li>
          <li><a class="nav__link" href="#gallery">좋아하는 것</a></li>
          <li><a class="nav__link" href="#interests">내 관심사</a></li>
          <li><a class="nav__link" href="#to-webtory">To. 웹토리</a></li>
        </ul>
      </nav>

      <main class="main">
        <section id="photo-dump" class="section">
          <h2 class="section__title">📷 포토 덤프</h2>
          <div class="photo-dump">
            <figure class="photo-dump__item photo-dump__item--a">
              <img src="images/photo4.webp" alt="바닷가 노을" />
            </figure>
            <figure class="photo-dump__item photo-dump__item--b">
              <img src="images/photo2.webp" alt="책과 사진 전시" />
            </figure>
            <figure class="photo-dump__item photo-dump__item--c">
              <img src="images/photo3.webp" alt="누워 있는 고양이" />
            </figure>
            <figure class="photo-dump__item photo-dump__item--d">
              <img src="images/photo1.webp" alt="부스 단체 사진" />
            </figure>
            <figure class="photo-dump__item photo-dump__item--e">
              <img src="images/photo5.webp" alt="밤 산책길" />
            </figure>
            <figure class="photo-dump__item photo-dump__item--f">
              <img src="images/photo6.webp" alt="불꽃놀이" />
            </figure>
          </div>
        </section>

        <section id="gallery" class="section">
          <h2 class="section__title">좋아하는 것: 반려동물 풍이</h2>
          <div class="gallery">
            <ul class="gallery__track">
              <li class="gallery__item"><img src="images/gallery1.webp" alt="반려동물 풍이 사진 1" /></li>
              <li class="gallery__item"><img src="images/gallery2.webp" alt="반려동물 풍이 사진 2" /></li>
              <li class="gallery__item"><img src="images/gallery3.webp" alt="반려동물 풍이 사진 3" /></li>
              <li class="gallery__item"><img src="images/gallery4.webp" alt="반려동물 풍이 사진 4" /></li>
              <li class="gallery__item"><img src="images/gallery5.webp" alt="반려동물 풍이 사진 5" /></li>
              <li class="gallery__item"><img src="images/gallery6.webp" alt="반려동물 풍이 사진 6" /></li>
              <li class="gallery__item"><img src="images/gallery7.webp" alt="반려동물 풍이 사진 7" /></li>
              <li class="gallery__item"><img src="images/gallery8.webp" alt="반려동물 풍이 사진 8" /></li>
              <li class="gallery__item"><img src="images/gallery9.webp" alt="반려동물 풍이 사진 9" /></li>
              <li class="gallery__item" aria-hidden="true"><img src="images/gallery1.webp" alt="" /></li>
              <li class="gallery__item" aria-hidden="true"><img src="images/gallery2.webp" alt="" /></li>
              <li class="gallery__item" aria-hidden="true"><img src="images/gallery3.webp" alt="" /></li>
              <li class="gallery__item" aria-hidden="true"><img src="images/gallery4.webp" alt="" /></li>
              <li class="gallery__item" aria-hidden="true"><img src="images/gallery5.webp" alt="" /></li>
              <li class="gallery__item" aria-hidden="true"><img src="images/gallery6.webp" alt="" /></li>
              <li class="gallery__item" aria-hidden="true"><img src="images/gallery7.webp" alt="" /></li>
              <li class="gallery__item" aria-hidden="true"><img src="images/gallery8.webp" alt="" /></li>
              <li class="gallery__item" aria-hidden="true"><img src="images/gallery9.webp" alt="" /></li>
            </ul>
          </div>
        </section>

        <section id="interests" class="section">
          <h2 class="section__title">내 관심사</h2>
          <ul class="cards">
            <li class="card">
              <img class="card__thumb" src="images/interest1.webp" alt="대만의 골목 풍경" />
              <p class="card__title">해외여행</p>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="images/interest2.webp" alt="태극기 응원이 펼쳐진 축구 경기장" />
              <p class="card__title">축구</p>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="images/interest3.webp" alt="낮 경기가 열리는 야구장 전경" />
              <p class="card__title">야구</p>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="images/interest4.webp" alt="노을을 담고 있는 카메라 화면" />
              <p class="card__title">사진 촬영</p>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="images/interest5.webp" alt="밤하늘에 터지는 불꽃" />
              <p class="card__title">불꽃놀이</p>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="images/interest6.webp" alt="맑은 날의 강변 풍경" />
              <p class="card__title">여행</p>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="images/interest7.webp" alt="치킨과 맥주" />
              <p class="card__title">치맥</p>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
          </ul>
        </section>

        <section id="to-webtory" class="section">
          <h2 class="section__title">To. 웹토리</h2>
          <div class="letter">
            <p class="letter__line">잘 부탁드립니다!</p>
          </div>
        </section>
      </main>
    </div>

    <footer class="footer">
      <p>첫 과제 끄읕~!</p>
    </footer>
  </body>
</html>
